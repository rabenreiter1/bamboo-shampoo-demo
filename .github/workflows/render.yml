name: render
on:
  push:
    branches: [claude/render-test]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          pip install bpy==4.2.0 || pip install bpy
          python -c "import bpy; print('blender', bpy.app.version_string)"
      - name: Render
        run: python render/probe.py
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: out/ }
